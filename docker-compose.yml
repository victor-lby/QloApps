services:
  qloapps:
    build: .
    container_name: qloapps_web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./upload:/var/www/html/upload
      - ./cache:/var/www/html/cache
      - ./log:/var/www/html/log
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    depends_on:
      - mysql
    networks:
      - qloapps_network

  mysql:
    image: mysql:8.0
    container_name: qloapps_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qloapps_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qloapps}
      MYSQL_USER: ${MYSQL_USER:-qloapps_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qloapps_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - qloapps_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: qloapps_phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-qloapps_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-qloapps_pass}
    depends_on:
      - mysql
    networks:
      - qloapps_network

volumes:
  mysql_data:

networks:
  qloapps_network:
    driver: bridge